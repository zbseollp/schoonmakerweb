# Deze worker draait in het Cloudflare-account van info@zb-marketing.com
# (twilight-breeze-d943, account aa20277e…). Jenkins CLOUDFLARE_API_TOKEN
# authenticates to that account only — do NOT point account_id at another
# Cloudflare account (that causes Authentication error [code: 10000]).
# Domains stay in the Cloudflare dashboard; never add custom-domain routes here.
name = "schoonmakerweb"
main = "worker/index.js"
account_id = "aa20277e66394b81d65252fd5708e2c0"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
html_handling = "force-trailing-slash"
not_found_handling = "404-page"
run_worker_first = ["/sitemap*.xml", "/sitemap.xml", "/sitemap_index.xml", "/feed", "/feed/"]
