# Het Cloudflare-account is op de Tenant in Payload ingesteld — zet hier geen
# account_id vast; de deploy haalt het account uit de Payload-configuratie.
# Domains stay in the Cloudflare dashboard; never add custom-domain routes here.
name = "schoonmakerweb"
main = "worker/index.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
html_handling = "force-trailing-slash"
not_found_handling = "404-page"
run_worker_first = ["/sitemap*.xml", "/sitemap.xml", "/sitemap_index.xml", "/feed", "/feed/"]
