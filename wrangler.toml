# Deze worker draait in het Cloudflare-account van info@zb-marketing.com
# (twilight-breeze-d943). Kiest wrangler het verkeerde account, zet dan
# CLOUDFLARE_ACCOUNT_ID=aa20277e66394b81d65252fd5708e2c0 voor het commando.
name = "schoonmakerweb"
main = "worker/index.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
html_handling = "force-trailing-slash"
not_found_handling = "404-page"
run_worker_first = ["/sitemap*.xml", "/sitemap.xml", "/sitemap_index.xml", "/feed", "/feed/"]
